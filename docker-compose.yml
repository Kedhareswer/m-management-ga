services:
  web:
    build: .
    ports:
      - '3000:3000'
    environment:
      - SCRAPER_URL=http://scraper:4000
      - DATA_DIR=/data
    volumes:
      - library-data:/data
    depends_on:
      - scraper

  scraper:
    build: ./scraper
    ports:
      - '4000:4000'
    init: true
    # Playwright/Chromium is happier with a bigger shared memory segment
    shm_size: 1gb

volumes:
  library-data:
